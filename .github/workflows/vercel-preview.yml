# Builds each PR's *merged* result (Development + PR branch, via
# refs/pull/N/merge) and deploys it as a Vercel preview, then:
#   - comments the URL on the PR and requests review from the testers (GitHub emails them)
#   - comments the URL on every Trello card linked in the PR description
#
# The job is named `deploy-preview`; make it a required status check on
# Development so a PR whose merged code fails to build can't be merged.
#
# Opt-in for now: only PRs with the `preview` label run. Remove the label
# check in `if:` below to run on every PR. (A skipped job still satisfies a
# required status check, so unlabeled PRs aren't blocked.)
#
# Secrets:   VERCEL_TOKEN, TRELLO_API_KEY, TRELLO_TOKEN
# Variables: PREVIEW_TESTERS (comma-separated GitHub usernames)
name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [Development]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_3M9H9astUFK9JNHkMXfdwqAr
  VERCEL_PROJECT_ID: prj_W9usyjSTozcHkahMzkQSJM2n0Rgr

jobs:
  deploy-preview:
    # Secrets aren't available to PRs from forks. Adding any other label
    # shouldn't trigger a redeploy.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    # Job-level so skipped runs (e.g. other labels) don't cancel a deploy.
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # checks out the PR merge commit by default

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm add --global vercel@latest

      - name: Pull Vercel preview settings and env vars
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Requesting the testers' review is what makes GitHub email them.
      - name: Comment preview URL and request tester review
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_TESTERS: ${{ vars.PREVIEW_TESTERS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const testers = (process.env.PREVIEW_TESTERS || '')
              .split(',')
              .map(t => t.trim().replace(/^@/, ''))
              .filter(t => t && t.toLowerCase() !== pr.user.login.toLowerCase());

            const marker = '<!-- vercel-preview -->';
            const body = [
              marker,
              `**Vercel preview (merged with \`${pr.base.ref}\`):** ${process.env.PREVIEW_URL}`,
              '',
              `Commit: ${pr.head.sha.slice(0, 7)}`,
              '',
              testers.length
                ? `${testers.map(t => `@${t}`).join(' ')}: please test the preview, then under **Files changed → Review changes** either **Approve** (auto-merges into \`${pr.base.ref}\`) or **Request changes** with what failed and close the PR.`
                : '_No testers configured (set the PREVIEW_TESTERS repo variable)._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            // (Re-)request review on every deploy so testers are notified that new code is ready.
            if (testers.length) {
              try {
                await github.rest.pulls.requestReviewers({ owner, repo, pull_number: issue_number, reviewers: testers });
              } catch (e) {
                core.warning(`Could not request review from ${testers.join(', ')}: ${e.message}`);
              }
            }

      # Fallback in case the email is missed: post the link on each Trello card
      # linked in the PR description (https://trello.com/c/<shortLink>/...).
      - name: Comment preview URL on linked Trello cards
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const shortLinks = [...new Set(
              [...(pr.body || '').matchAll(/trello\.com\/c\/([A-Za-z0-9]+)/g)].map(m => m[1])
            )];
            if (!shortLinks.length) {
              core.warning('No Trello card links found in the PR description; skipping Trello comments.');
              return;
            }
            if (!process.env.TRELLO_API_KEY || !process.env.TRELLO_TOKEN) {
              core.warning('TRELLO_API_KEY / TRELLO_TOKEN secrets not set; skipping Trello comments.');
              return;
            }

            const text = [
              `Preview for PR #${pr.number} "${pr.title}" (commit ${pr.head.sha.slice(0, 7)}):`,
              process.env.PREVIEW_URL,
              '',
              `PR: ${pr.html_url}`,
            ].join('\n');
            const auth = `OAuth oauth_consumer_key="${process.env.TRELLO_API_KEY}", oauth_token="${process.env.TRELLO_TOKEN}"`;

            for (const card of shortLinks) {
              const res = await fetch(`https://api.trello.com/1/cards/${card}/actions/comments`, {
                method: 'POST',
                headers: { Authorization: auth, 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
              });
              if (res.ok) core.info(`Commented on Trello card ${card}`);
              else core.warning(`Trello card ${card}: ${res.status} ${await res.text()}`);
            }
